# docker-compose.test.yml
version: '3.8'
services:
  postgres_test:
    image: postgres:15
    container_name: dsproject-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: dsproject_test
    ports:
      - "5433:5432"
    # tmpfs speichert Daten im RAM -> schneller und automatisch leer nach Neustart
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d dsproject_test"]
      interval: 2s
      timeout: 5s
      retries: 10
