runtime: nodejs20

entrypoint: npm start

env: standard

instance_class: F1

env_variables:
  NODE_ENV: production
  DB_USER: postgres
  DB_NAME: postgres
  INSTANCE_CONNECTION_NAME: fair-future-472907-n3:us-central1:softwareprojekt

secrets:
  - name: db-password
    version: latest
    env: DB_PASSWORD

handlers:
  # API-Endpunkte gehen zu Express
  - url: /api/.*
    script: auto
  # Statische Frontend-Dateien
  - url: /(.*\.(js|css|png|jpg|svg|ico))
    static_files: public/\1
    upload: public/(.*\.(js|css|png|jpg|svg|ico))
    expiration: "1d"
  # Alle anderen Requests zu Express (SPA-Routing)
  - url: /.*
    script: auto
