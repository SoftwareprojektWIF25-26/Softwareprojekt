version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ds-project-db-test
    environment:

      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: dsproject_test
    ports:
      # Mappt den internen Port 5432 auf den externen Port 5433 für die Tests
      - "5433:5432"

    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:

      test: ["CMD-SHELL", "pg_isready -U test_user -d dsproject_test"]
      interval: 3s
      timeout: 3s
      retries: 10
