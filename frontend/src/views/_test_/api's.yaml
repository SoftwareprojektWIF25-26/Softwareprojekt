openapi: 3.0.0
info:
  title: Projekt Management API
  version: 1.0.0
  description: API für Projekt- und Task-Management, inklusive Wizard, Dashboard und Calculation-Service
servers:
  - url: http://localhost:8080
    description: Development Server

tags:
  - name: Startpage
    description: Startseite mit Projektübersicht und Statistiken
  - name: Dashboard
    description: Projekt-Dashboard mit Timeline und Task-Management
  - name: Projects
    description: Projekt-Management (CRUD)
  - name: Wizard
    description: Wizard-basierte Projekterstellung
  - name: Planning
    description: Projektplan-Generierung
  - name: Config
    description: Konfigurationsdaten (Felder, Gewichte)
  - name: Calculation
    description: Berechnungslogik für Projektmetriken

paths:
  # ========================================
  # CONFIG ENDPOINTS (NEU aus configRoutes.ts)
  # ========================================
  /api/config/fields/default:
    get:
      summary: Standard-Eingabefelder abrufen
      tags:
        - Config
      responses:
        '200':
          description: Erfolgreich
          content:
            application/json:
              schema:
                type: object
                description: Key-Value Paarung der Standardfelder
        '500':
          description: Serverfehler

  /api/config/weights/default:
    get:
      summary: Standard-Gewichte abrufen
      tags:
        - Config
      responses:
        '200':
          description: Erfolgreich
          content:
            application/json:
              schema:
                type: object
                description: Key-Value Paarung der Standardgewichte
        '500':
          description: Serverfehler

  # ========================================
  # CALCULATION ENDPOINTS (NEU aus calcRoutes.ts)
  # ========================================
  /api/calc/calculate:
    post:
      summary: Projektmetriken berechnen
      description: Berechnet Metriken basierend auf Inputs, Projekttyp und Teamgröße
      tags:
        - Calculation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculationRequest'
      responses:
        '200':
          description: Berechnung erfolgreich
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  metrics:
                    $ref: '#/components/schemas/ProjectMetrics'
        '400':
          description: Validierungsfehler (Inputs fehlen, Teamgröße < 1)
        '500':
          description: Serverfehler

  /api/calc/weights/validate:
    post:
      summary: Gewichte validieren und normalisieren
      tags:
        - Calculation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - weights
              properties:
                weights:
                  type: object
                  additionalProperties:
                    type: number
                  description: Objekt mit Gewichtungen (Key -> Number)
      responses:
        '200':
          description: Erfolgreich normalisiert
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  originalSum:
                    type: number
                  normalizedWeights:
                    type: object
                    additionalProperties:
                      type: number
        '400':
          description: Ungültige Gewichte
        '500':
          description: Serverfehler

  # ========================================
  # STARTPAGE ENDPOINTS
  # ========================================
  /api/startpage:
    get:
      summary: Projektliste mit Filtern
      description: Ruft die Liste aller Projekte mit optionalen Filterparametern ab
      tags:
        - Startpage
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Suchbegriff für Projektname
        - name: status
          in: query
          schema:
            type: string
            enum: [PLANNING, IN_PROGRESS, COMPLETED, ON_HOLD, CANCELLED]
          description: Filter nach Projektstatus
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [updatedAt, createdAt, title]
            default: updatedAt
          description: Sortierung nach Feld
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sortierreihenfolge
      responses:
        '200':
          description: Erfolgreich - Liste der Projekte
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '400':
          description: Ungültige Anfrage
        '500':
          description: Serverfehler

  /api/startpage/statistics:
    get:
      summary: Statistiken
      description: Ruft allgemeine Projekt-Statistiken ab
      tags:
        - Startpage
      responses:
        '200':
          description: Erfolgreich - Statistiken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statistics'
        '400':
          description: Fehlerhafte Anfrage
        '500':
          description: Serverfehler

  /api/startpage/recent-projects:
    get:
      summary: Zuletzt bearbeitete Projekte
      description: Ruft die zuletzt bearbeiteten Projekte ab
      tags:
        - Startpage
      responses:
        '200':
          description: Erfolgreich - Zuletzt bearbeitete Projekte
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '400':
          description: Fehlerhafte Anfrage
        '500':
          description: Serverfehler

  # ========================================
  # DASHBOARD ENDPOINTS
  # ========================================
  /api/dashboard/{projectId}:
    get:
      summary: Projekt-Dashboard
      description: Ruft die Dashboard-Daten für ein bestimmtes Projekt ab
      tags:
        - Dashboard
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
          description: ID des Projekts
      responses:
        '200':
          description: Erfolgreich - Dashboard-Daten (gemappt als Project)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Projekt nicht gefunden
        '500':
          description: Serverfehler

  /api/dashboard/{projectId}/timeline:
    get:
      summary: Timeline/Gantt-Ansicht
      description: Ruft die Timeline- bzw. Gantt-Daten für ein Projekt ab
      tags:
        - Dashboard
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
          description: ID des Projekts
      responses:
        '200':
          description: Erfolgreich - Timeline-Daten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timeline'
        '404':
          description: Projekt nicht gefunden
        '500':
          description: Serverfehler

  /api/dashboard/tasks/{taskId}/status:
    patch:
      summary: Task-Status aktualisieren
      description: Aktualisiert den Status einer bestimmten Aufgabe
      tags:
        - Dashboard
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
          description: ID der Aufgabe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [TODO, IN_PROGRESS, BLOCKED, DONE]
      responses:
        '200':
          description: Erfolgreich aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Ungültige Anfrage
        '404':
          description: Aufgabe nicht gefunden
        '500':
          description: Serverfehler

  /api/dashboard/{projectId}/status:
    patch:
      summary: Projekt-Status aktualisieren
      tags:
        - Dashboard
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  # Typ im Code ist 'any', hier enum zur Sicherheit
                  enum: [PLANNING, IN_PROGRESS, ON_HOLD, COMPLETED, CANCELLED]
      responses:
        '200':
          description: Erfolgreich aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Serverfehler

  /api/dashboard/{projectId}/template-phase/{phase}/status:
    patch:
      summary: Template-Phase-Status aktualisieren
      tags:
        - Dashboard
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: phase
          in: path
          required: true
          schema:
            type: string
            enum: [businessUnderstanding, dataCharacteristics, analysisConfig, deploymentConfig, utilizationConfig]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [BLOCKED, READY, DRAFT, COMPLETED]
      responses:
        '200':
          description: Erfolgreich aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Serverfehler

  /api/dashboard/{projectId}/evaluations:
    post:
      summary: Evaluierung erstellen
      tags:
        - Dashboard
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - category
                - rating
              properties:
                category:
                  type: string
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                notes:
                  type: string
      responses:
        '201':
          description: Erfolgreich erstellt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Serverfehler

  # ========================================
  # PROJECT MANAGEMENT ENDPOINTS
  # ========================================
  /api/projects:
    post:
      summary: Neues Projekt erstellen
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                domain:
                  type: string
      responses:
        '201':
          description: Projekt erfolgreich erstellt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validierungsfehler
        '500':
          description: Serverfehler

  /api/projects/{projectId}:
    get:
      summary: Projekt abrufen
      tags:
        - Projects
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Erfolgreich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '404':
          description: Projekt nicht gefunden
        '500':
          description: Serverfehler

    patch:
      summary: Projekt aktualisieren (Basisdaten)
      tags:
        - Projects
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                domain:
                  type: string
                status:
                  type: string
                  enum: [PLANNING, IN_PROGRESS, ON_HOLD, COMPLETED, CANCELLED]
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
                wizardStep:
                  type: integer
                  minimum: 0
                  maximum: 6
                wizardCompleted:
                  type: boolean
      responses:
        '200':
          description: Erfolgreich aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validierungsfehler
        '500':
          description: Serverfehler

    delete:
      summary: Projekt löschen
      tags:
        - Projects
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Erfolgreich gelöscht
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Fehler
        '500':
          description: Serverfehler

  # ========================================
  # WIZARD & PLANNING
  # ========================================
  /api/projects/{projectId}/business-understanding:
    patch:
      summary: Business Understanding aktualisieren
      tags:
        - Projects
        - Wizard
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessUnderstandingInput'
      responses:
        '200':
          description: Erfolgreich aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Serverfehler

  /api/projects/{projectId}/data-characteristics:
    patch:
      summary: Data Characteristics aktualisieren
      tags:
        - Projects
        - Wizard
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataCharacteristicsInput'
      responses:
        '200':
          description: Erfolgreich aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Serverfehler

  /api/projects/{projectId}/complete-wizard:
    post:
      summary: Wizard abschließen
      tags:
        - Projects
        - Wizard
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Wizard abgeschlossen
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  projectId:
                    type: integer
                  project:
                    type: object
        '500':
          description: Serverfehler

  /api/projects/{projectId}/plan:
    post:
      summary: Projektplan erstellen
      tags:
        - Projects
        - Planning
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - metrics
              properties:
                metrics:
                  $ref: '#/components/schemas/ProjectMetrics'
      responses:
        '201':
          description: Projektplan erstellt
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ProjectPlanResponse'
                  message:
                    type: string
        '500':
          description: Serverfehler

components:
  schemas:
    # --- Calculation Schemas ---
    CalculationRequest:
      type: object
      required:
        - inputs
        - projectType
        - teamSize
      properties:
        projectType:
          type: string
          description: z.B. 'NLP', 'COMPUTER_VISION'
        teamSize:
          type: integer
          minimum: 1
        inputs:
          type: array
          description: Liste der Eingabewerte aus dem Wizard
          items:
            type: object
            # Hier kann die Struktur der Inputs spezifiziert werden,
            # wenn bekannt (z.B. id, value, fieldId)
            additionalProperties: true

    # --- Project Schemas ---
    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        status:
          type: string
          enum: [PLANNING, IN_PROGRESS, ON_HOLD, COMPLETED, CANCELLED]
        lastModified:
          type: string
          format: date-time
        description:
          type: string

    Statistics:
      type: object
      additionalProperties: true
      # Wenn du die genaue Struktur von getStatistics() kennst, hier definieren.
      # Laut Code wird ein Objekt zurückgegeben.

    Timeline:
      type: object
      properties:
        projectId:
          type: string
        events:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              title:
                type: string
              startDate:
                type: string
                format: date
              endDate:
                type: string
                format: date
              type:
                type: string
                enum: [task, milestone, phase]

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        message:
          type: string
        errors:
          type: array
          items:
            type: object

    ProjectDetail:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        domain:
          type: string
        status:
          type: string
        # Weitere Felder basierend auf ProjectService.getProjectById Rückgabe
        wizardStep:
          type: integer
        templatePhases:
          type: array
          items:
            type: object

    BusinessUnderstandingInput:
      type: object
      additionalProperties: true

    DataCharacteristicsInput:
      type: object
      additionalProperties: true

    ProjectMetrics:
      type: object
      description: Ergebnis der Calculation
      required:
        - categoryScores
        - effortPersonWeeks
        - durationWeeks
      properties:
        categoryScores:
          type: object
        overallScore:
          type: number
        effortPersonWeeks:
          type: number
        durationWeeks:
          type: integer
        projectSize:
          type: string
        phases:
          type: array
          items:
            type: object

    ProjectPlanResponse:
      type: object
      description: Der generierte Projektplan
      properties:
        id:
          type: integer
        estimatedDuration:
          type: integer
        estimatedEffort:
          type: number
        phases:
          type: array
          items:
            type: object
